services:
  postgres:
    image: postgres:17-alpine
    container_name: mizaaj-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mizaaj
      POSTGRES_USER: mizaaj
      POSTGRES_PASSWORD: mizaaj
    ports:
      - "5432:5432"
    volumes:
      - mizaaj-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizaaj -d mizaaj"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mizaaj-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mizaaj
      MINIO_ROOT_PASSWORD: mizaaj-secret
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mizaaj-minio:/data

  minio-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 mizaaj mizaaj-secret; do sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/mizaaj-uploads;
      /usr/bin/mc anonymous set download local/mizaaj-uploads;
      "

volumes:
  mizaaj-postgres:
  mizaaj-minio:
